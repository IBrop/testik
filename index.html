<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IBrop.dev</title>
  <meta name="description" content="IBrop Developer Hub">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #1b2b50 0%, #0b1020 45%, #05070d 100%);
      color: white;
    }

    .card {
      width: min(92%, 650px);
      padding: 50px 35px;
      border-radius: 24px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(18px);
      text-align: center;
      box-shadow: 0 20px 70px rgba(0,0,0,0.35);
    }

    .logo {
      font-size: 56px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: clamp(38px, 8vw, 64px);
      margin-bottom: 12px;
    }

    .domain {
      color: #66aaff;
    }

    p {
      color: #b8c2d8;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(70, 255, 150, 0.1);
      border: 1px solid rgba(70, 255, 150, 0.25);
      color: #7dffb2;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #55ff99;
      box-shadow: 0 0 12px #55ff99;
    }

    .links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      text-decoration: none;
      color: white;
      padding: 13px 20px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      transition: 0.2s;
    }

    a:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.14);
    }

    footer {
      margin-top: 35px;
      color: #647089;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">⚡</div>

    <h1>
      IBrop<span class="domain">.dev</span>
    </h1>

    <p>
      Developer hub, experiments, applications and future projects.
    </p>

    <div class="status">
      <span class="dot"></span>
      Domain is working
    </div>

    <div class="links">
      <a href="#">NeoLite</a>
      <a href="#">Projects</a>
      <a href="#">GitHub</a>
    </div>

    <footer>
      © 2026 IBrop.dev
    </footer>

  </div>

</body>
</html>
