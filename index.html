<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IBrop</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="page">

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <header class="navbar">

        <a class="navbar-logo" href="/">
            IBrop
        </a>

        <nav class="navbar-links">
            <a class="active" href="/">Обо мне</a>
            <a href="/portfolio/">Портфолио</a>
            <a href="https://neo.ibrop.dev/">Neo</a>
        </nav>

    </header>


    <!-- ОБО МНЕ -->
    <main>

        <section class="profile">

            <div class="avatar-wrapper">
                <img
                    id="profile-avatar"
                    class="avatar"
                    src="/assets/avatar.png"
                    alt="IBrop"
                >
            </div>


            <div class="profile-info">

                <h1 id="profile-name">
                    IBrop
                </h1>

                <div
                    id="profile-subtitle"
                    class="profile-subtitle"
                >
                    Developer • Engineer
                </div>

                <div
                    id="profile-description"
                    class="profile-description"
                >
                    Загрузка...
                </div>

            </div>

        </section>


        <!-- ПРОЕКТЫ -->
        <section class="featured-section">

            <div class="section-header">

                <div>
                    <div class="section-small">
                        Портфолио
                    </div>

                    <h2 id="projects-title">
                        Любимые проекты
                    </h2>
                </div>

                <a
                    class="all-projects-button"
                    href="/portfolio/"
                >
                    Все проекты →
                </a>

            </div>


            <div
                id="featured-projects"
                class="projects-grid"
            >
            </div>

        </section>

    </main>

</div>


<script src="/script.js"></script>

</body>
</html>
