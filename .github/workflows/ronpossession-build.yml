name: Build RoN Possession

on:
  push:
    branches: [ build-ron-possession ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        run: gradle -p ronpossession-build clean build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ReignOfNether-Possession-1.20.1
          path: ronpossession-build/build/libs/*.jar
          if-no-files-found: error
